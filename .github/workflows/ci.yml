name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server & importer (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # The native database module is built for each Node version, so both are tried.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            importer/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix importer
      - run: npm --prefix server run type-check
      - run: npm --prefix importer run type-check
      - run: npm --prefix server run lint
      - run: npm --prefix importer run lint
      - run: npm --prefix server test
      - run: npm --prefix importer test

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run prettier

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # The client is generated from the API description in server/spec; regenerating it
      # must change nothing, or the two have drifted apart.
      - run: npm run openapi-ts
      - run: git diff --exit-code -- src/generated
      # src/i18n is build-generated and gitignored, so compile it before tests.
      - run: npm run i18n:compile
      - run: npm run type-check
      - run: npm run lint
      - run: npm run prettier
      - run: npm run test:unit
      # The bundle the product ships is produced here and nowhere else.
      - run: npm run build

  # What somebody installing it does, start to finish, on the system it will run on:
  # the README's own steps, then a library scanned and a page read from the built
  # server through the machine's network address.
  install:
    name: Install, build and run (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run install:all
      - run: npm run build
      - run: npm run smoke
