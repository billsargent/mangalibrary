name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server & importer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            importer/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix importer
      - run: npm --prefix server run type-check
      - run: npm --prefix importer run type-check
      - run: npm --prefix server test
      - run: npm --prefix importer test

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # src/i18n is build-generated and gitignored, so compile it before tests.
      - run: npm run i18n:compile
      - run: npm run type-check
      - run: npm run test:unit
